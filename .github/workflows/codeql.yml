name: CodeQL
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '23 4 * * 1' }]
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    # Code scanning on a private repo needs GitHub Code Security (or a public repo).
    # Once enabled in Settings > Code security, set repo variable CODE_SCANNING=true.
    if: vars.CODE_SCANNING == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@v4
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v4
